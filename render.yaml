services:
  - type: web
    name: biblio-insepti
    runtime: docker
    plan: free
    region: frankfurt
    branch: backup-before-gcp-migration
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: biblio-insepti-db
          property: connectionString
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: ENTRA_REDIRECT_URI
        value: https://biblio-insepti.onrender.com/api/auth/callback
      - key: ENTRA_POST_LOGOUT_REDIRECT_URI
        value: https://biblio-insepti.onrender.com/login
      - key: ALLOWED_EMAIL_DOMAINS
        value: insepti.com
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: NOTION_TOKEN
        sync: false

databases:
  - name: biblio-insepti-db
    databaseName: biblio_insepti
    user: biblio_insepti
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    ipAllowList: []
