name = "insepti-biblio-prompts"
main = ".open-next/worker.js"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "insepti_biblio"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "db/migrations"

# R2 non utilisé tant qu'aucun upload n'est demandé (voir passation section 6).
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "insepti-biblio-uploads"

[observability]
enabled = true
